services:
  mysql:
    image: mysql:8.4.13
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: board
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.10.2
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis-data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    # Spring graceful shutdown 한도 (기본 30초)보다 길게 기다린 뒤 SIGKILL
    stop_grace_period: 40s
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - app-files:/app/files
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  localstack:
    image: localstack/localstack:2026.10.4
    profiles: ["s3"]
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN}
      SERVICES: s3
      PERSISTENCE: 1
    volumes:
      - localstack-data:/var/lib/localstack
      - ./docker/localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro
    ports:
      - "4566:4566"


volumes:
  mysql-data:
  redis-data:
  app-files:
  localstack-data:
