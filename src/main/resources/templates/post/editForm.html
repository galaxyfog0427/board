<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 수정</title>
</head>
<body>
<div>
    <h2>게시글 수정</h2>
    <form th:action="@{/posts/{postId}/edit(postId=${postId})}" method="post">
        <div>
            <label for="title">제목</label>
            <input type="text" id="title" name="title" th:value="${postForm.title}">
        </div>
        <div>
            <label for="content">내용</label>
            <textarea id="content" name="content" th:text="${postForm.content}"></textarea>
        </div>
        <button type="submit">저장</button>
    </form>
</div>
</body>
</html>
