<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>게시글 목록</title>
</head>
<body>
<div>
    <h2 th:text="#{page.list}">게시글 목록</h2>
    <div>
        <span th:if="${loginMember != null}" th:text="${loginMember.nickname} + '님 환영합니다'"></span>
        <a th:if="${loginMember == null}" th:href="@{/members/add}" th:text="#{page.join}"></a> |
        <a th:if="${loginMember == null}" th:href="@{/login}" th:text="#{page.login}"></a> |
        <form th:if="${loginMember != null}" th:action="@{/logout}" method="post" style="display:inline">
            <button type="submit" th:text="#{button.logout}"></button>
        </form>
    </div>
    <table th:if="${!posts.isEmpty()}">
        <thead>
        <tr>
            <th th:text="#{label.number}">번호</th>
            <th th:text="#{post.title}">제목</th>
            <th th:text="#{post.writer}">작성자</th>
            <th th:text="#{post.commentCount}">댓글 수</th>
            <th th:text="#{post.createdAt}">작성일</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="post : ${posts}">
            <td th:text="${post.id}"></td>
            <td>
                <a th:href="@{/posts/{postId}(postId=${post.id})}" th:text="${post.title}"></a>
            </td>
            <td th:text="${post.writerNickname}"></td>
            <td th:text="${post.commentCount}"></td>
            <td th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
        </tr>
        </tbody>
    </table>
    <p th:if="${posts.isEmpty()}" th:text="#{label.empty}">등록된 게시글이 없습니다.</p>

    <div th:if="${posts.totalPages > 1}">
        <a th:if="${posts.hasPrevious()}"
           th:href="@{/posts(page=${posts.number - 1})}"
           th:text="#{button.prev}">이전</a>

        <span th:each="i : ${#numbers.sequence(0, posts.totalPages - 1)}">
            <a th:href="@{/posts(page=${i})}"
               th:text="${i + 1}"
               th:style="${i == post.number} ? 'front-weight:bold;' : ''"></a>
        </span>

        <a th:if="${posts.hasNext()}"
           th:href="@{/posts(page=${posts.number + 1})}"
           th:text="#{button.next}">다음</a>
    </div>

    <a th:href="@{/posts/add}" th:text="#{button.add}">게시글 작성</a>
</div>
</body>
</html>
