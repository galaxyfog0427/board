<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 상세</title>
</head>
<body>
<div>
    <h2 th:text="${post.title}"></h2>
    <p th:text="${'작성자: ' + writer.nickname}"></p>
    <p th:text="${post.content}"></p>
    <p><span th:text="#{post.createdAt}"></span>: <span th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}"></span></p>
    <p><span th:text="#{post.viewCount}"></span>: <span th:text="${viewCount}"></span></p>
    <div>
        <span th:text="#{post.likeCount}"></span>: <span th:text="${likeStatus.count()}"></span>
        <form th:if="${!likeStatus.likedByMe()}" th:action="@{/posts/{postId}/like(postId=${post.id})}" method="post" style="display:inline">
            <button type="submit" th:text="#{button.like}"></button>
        </form>
        <form th:if="${likeStatus.likedByMe()}" th:action="@{/posts/{postId}/unlike(postId=${post.id})}" method="post" style="display:inline">
            <button type="submit" th:text="#{button.unlike}"></button>
        </form>
    </div>

    <a th:href="@{/posts/{postId}/edit(postId=${post.id})}" th:text="#{button.edit}">수정</a>
    <a th:href="@{/posts}" th:text="#{button.list}">목록으로</a>

    <div th:if="${!postFiles.isEmpty()}">
        <h3 th:text="#{post.files}"></h3>
        <ul>
            <li th:each="file : ${postFiles}">
                <a th:href="@{/posts/files/{fileId}/download(fileId=${file.id})}" th:text="${file.uploadFileName}"></a>
                <div th:if="${file.image}">
                    <img th:src="@{/posts/files/{fileId}/view(fileId=${file.id})}" style="max-width: 300px;"/>
                </div>
            </li>
        </ul>
    </div>

    <h3 th:text="#{label.comments}">댓글</h3>
    <ul>
        <li th:each="comment : ${comments}">
            <strong th:text="${comment.member.nickname}"></strong>
            <span th:text="${#temporals.format(comment.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
            <p th:text="${comment.content}"></p>
        </li>
    </ul>

    <p class="error-message" th:if="${commentError}" th:text="${commentError}"></p>
    <form th:if="${loginMember != null}"
          th:action="@{/posts/{postId}/comments(postId=${post.id})}" method="post">
        <textarea name="content" maxlength="1000"></textarea>
        <button type="submit" th:text="#{button.comment}">댓글 작성</button>
    </form>
</div>
</body>
</html>
