<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 등록</title>
</head>
<body>
<div>
    <h2 th:text="#{page.add}">게시글 등록</h2>
    <form th:action="@{/posts/add}" th:object="${postForm}" method="post">
        <div>
            <label for="memberId" th:text="#{post.memberId}">작성자 회원 ID (임시 입력, 로그인 구현 후 제거 예정)</label>
            <input type="text" id="memberId" th:field="*{memberId}"/>
        </div>
        <div>
            <label for="title" th:text="#{post.title}">제목</label>
            <input type="text" id="title" th:field="*{title}">
        </div>
        <div>
            <label for="content" th:text="#{post.content}">내용</label>
            <input type="text" id="content" th:field="*{content}"/>
        </div>
        <button type="submit" th:text="#{button.save}">저장</button>
    </form>
</div>
</body>
</html>
