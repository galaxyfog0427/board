<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <style>
        .error-message {
            color: red;
        }

        .field-error {
            border: 1px solid red;
        }
    </style>
</head>
<body>
<div>
    <h2 th:text="#{page.login}"></h2>
    <form th:action="@{/login}" th:object="${loginForm}" method="post">
        <div th:if="${#fields.hasGlobalErrors()}">
            <p class="error-message" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
        </div>
        <div>
            <label for="loginId" th:text="#{member.loginId}"></label>
            <input type="text" id="loginId" th:field="*{loginId}" th:errorclass="field-error">
            <div class="error-message" th:errors="*{loginId}"></div>
        </div>
        <div>
            <label for="password" th:text="#{member.password}"></label>
            <input type="password" id="password" th:field="*{password}" th:errorclass="field-error">
            <div class="error-message" th:errors="*{password}"></div>
        </div>
        <button type="submit" th:text="#{button.login}"></button>
    </form>
</div>
</body>
</html>
